<!DOCTYPE html>
<html>
    <head>
        <title>Creating Table</title>
        <style>
            table,tr,th,td{
                border-width: 1px;
                border-color: black;
                border-style: solid;
            }
        </style>
    </head>

    <body>
        <table>
            <caption>Student Information</caption>
            <tr>
                <th>Name</th>
                <th>Gender</th>
                <th>Country</th>
                <th>Age</th>
            </tr>
            <tr>
                <td>Tristan</td>
                <td>Male</td>
                <td>Philippines</td>
                <td>1</td>
            </tr>
        </table>
    </body>
</html>
